[package]
name = "fileship"
version = "1.0.0"
edition = "2021"
description = "Fileship — fast Rust file manager (port of the Go original)"
license = "MIT"

[[bin]]
name = "fileship"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json", "query", "http1", "ws", "multipart"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
bcrypt = "0.19"
sha1 = "0.10"
sha2 = "0.10"
md5 = "0.7"
hex = "0.4"
rand = "0.10"
chrono = "0.4"
base64 = "0.23"
url = "2"
mime_guess = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
zip = "9"
tar = "0.4"
flate2 = "1"
futures-util = "0.3"
tokio-tungstenite = "0.27"
rust-embed = "8"
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
rand_core = "0.10"
libc = "0.2.191"
hyper = { version = "1", features = ["server", "http1", "http2"] }
little_exif = "0.6.23"
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
bytes = "1.12.1"
crc32fast = "1.5.5"
quinn = "0.11.12"
h3 = "0.0.8"
h3-quinn = "0.0.10"
tower = "0.5.3"
openidconnect = "4.1.0"
rayon = "1.12.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
