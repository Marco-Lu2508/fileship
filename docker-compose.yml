services:
  fileship:
    image: ghcr.io/marco-lu2508/fileship:latest
    ports:
      - "8080:8080"
    volumes:
      - fileship-data:/data
      - fileship-db:/app
    environment:
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET:-}
      - ROOT_PATH=/data
      - DB_PATH=/app/fileship.db
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-1024}
    restart: unless-stopped

volumes:
  fileship-data:
  fileship-db:
